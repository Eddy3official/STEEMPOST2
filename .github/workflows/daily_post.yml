name: Steem Daily Posting Bot

on:
  schedule:
    # Runs daily at 06:00 UTC (09:00 EAT)
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: steem-daily-posting
  cancel-in-progress: false

jobs:
  publish-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Font & Image Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Daily Posting Bot
        env:
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python post_bot.py
        
